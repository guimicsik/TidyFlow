<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>AE Organizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #232323;
      color: #d4d4d4;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 100vh;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #323232;
      padding-bottom: 8px;
    }

    .header-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #8a8a8a;
    }

    .preset-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #1c1c1c;
      border: 1px solid #303030;
      border-radius: 3px;
      padding: 6px 8px;
    }

    .preset-bar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #8a8a8a;
      letter-spacing: 0.4px;
    }

    #presetSelect {
      flex: 1;
      min-width: 0;
      height: 24px;
      background-color: #262626;
      color: #e0e0e0;
      border: 1px solid #3c3c3c;
      border-radius: 3px;
      padding: 0 6px;
      font-size: 11px;
      outline: none;
    }

    #presetSelect:focus {
      border-color: #1473e6;
    }

    .btn-gear {
      height: 24px;
      padding: 0 8px;
      border-radius: 3px;
      border: 1px solid #3e3e3e;
      background-color: #2e2e2e;
      color: #d4d4d4;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .btn-gear:hover {
      background-color: #3a3a3a;
      border-color: #1473e6;
      color: #ffffff;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notice-text {
      font-size: 11px;
      color: #9a9a9a;
      line-height: 1.4;
    }

    .btn {
      min-height: 32px;
      padding: 6px 8px;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
      outline: none;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      margin: 2px 0;
    }

    .btn-tile {
      width: 100%;
      min-height: 48px;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 10px;
      line-height: 1.2;
      transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn-tile:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-tile-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      word-break: break-word;
      hyphens: auto;
    }

    /* Estado 2: Janela intermediária (<= 330px) -> Passa para 2x2 (dois botões por linha) */
    @media (max-width: 330px) {
      .actions-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .btn-tile {
        min-height: 44px;
        padding: 8px 6px;
        font-size: 11px;
      }
    }

    /* Estado 3: Janela estreita (<= 190px) -> Passa para 4x1 (um botão por linha em coluna) */
    @media (max-width: 190px) {
      .actions-grid {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .btn-tile {
        min-height: 34px;
        padding: 6px 8px;
        font-size: 11px;
      }
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn-primary {
      background-color: #1473e6;
      color: #ffffff;
      border: 1px solid #1473e6;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #0d66d0;
      border-color: #0d66d0;
    }

    .btn-primary:active:not(:disabled) {
      background-color: #095aba;
      border-color: #095aba;
    }

    .btn-secondary {
      background-color: #2e2e2e;
      color: #d4d4d4;
      border: 1px solid #3e3e3e;
      font-weight: 500;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #383838;
      border-color: #4f4f4f;
      color: #ffffff;
    }

    .btn-secondary:active:not(:disabled) {
      background-color: #252525;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #2e2e2e;
    }

    .toggle-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      color: #9a9a9a;
      transition: color 0.15s;
    }

    .toggle-container:hover {
      color: #d4d4d4;
    }

    .toggle-container input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .toggle-slider {
      position: relative;
      display: inline-block;
      width: 26px;
      height: 14px;
      background-color: #383838;
      border-radius: 14px;
      transition: background-color 0.15s;
      flex-shrink: 0;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 10px;
      width: 10px;
      left: 2px;
      bottom: 2px;
      background-color: #9a9a9a;
      border-radius: 50%;
      transition: transform 0.15s, background-color 0.15s;
    }

    .toggle-container input[type="checkbox"]:checked+.toggle-slider {
      background-color: #1473e6;
    }

    .toggle-container input[type="checkbox"]:checked+.toggle-slider::before {
      transform: translateX(12px);
      background-color: #ffffff;
    }

    .toggle-label {
      white-space: nowrap;
    }

    #statusMsg {
      min-height: 16px;
      font-size: 11px;
      color: #8f8f8f;
      word-break: break-word;
      line-height: 1.4;
    }

    #statusMsg.success {
      color: #4ec978;
    }

    #statusMsg.error {
      color: #f26d6d;
    }

    #statusMsg.warning {
      color: #e5a93c;
    }
  </style>
</head>

<body>
  <div class="header-row">
    <h1 id="headerTitle" class="header-title">AE Organizer</h1>
  </div>

  <!-- Barra de Seleção de Preset e Abertura do Preset Builder -->
  <div class="preset-bar">
    <span class="preset-bar-label">Preset</span>
    <select id="presetSelect" title="Selecionar Preset de Estrutura de Pastas"></select>
    <button type="button" id="btnOpenPresetBuilder" class="btn-gear"
      title="Abrir Editor de Estrutura de Pastas, Labels e Filtros">
      <span>⚙</span>
      <span>Editar</span>
    </button>
  </div>

  <div class="field-group">
    <p id="noticeText" class="notice-text">Selecione as composições no painel Project antes de organizar.</p>
    <div class="actions-grid">
      <button type="button" id="btnOrganize" class="btn btn-tile btn-primary">
        <span class="btn-tile-label">Organizar Projeto</span>
      </button>
      <button type="button" id="btnCreateStructure" class="btn btn-tile btn-secondary"
        title="Cria a estrutura de pastas vazia do preset selecionado">
        <span class="btn-tile-label">Criar estrutura de pastas</span>
      </button>
      <button type="button" id="btnMediaOnly" class="btn btn-tile btn-secondary">
        <span class="btn-tile-label">Apenas Midias</span>
      </button>
      <button type="button" id="btnCheckComps" class="btn btn-tile btn-secondary">
        <span id="btnCheckCompsLabel" class="btn-tile-label">Verificar composições</span>
      </button>
    </div>
  </div>

  <div class="options-group">
    <label class="toggle-container"
      title="Adiciona prefixos numéricos sequenciais (01_, 02_...) apenas às pastas da estrutura que tiverem arquivos">
      <input type="checkbox" id="chkPrefixNumbering" checked>
      <span class="toggle-slider"></span>
      <span class="toggle-label">Numeração Sequencial (01_, 02_)</span>
    </label>

    <label class="toggle-container" title="Salvar projeto antes de fazer esse ajuste">
      <input type="checkbox" id="chkSaveProject" checked>
      <span class="toggle-slider"></span>
      <span class="toggle-label">Salvar projeto antes de organizar</span>
    </label>

    <label class="toggle-container"
      title="Reduzir o projeto e deletar arquivos não usados nas composições selecionadas">
      <input type="checkbox" id="chkReduceProject">
      <span class="toggle-slider"></span>
      <span class="toggle-label">Reduce Project</span>
    </label>

    <label class="toggle-container" title="Deletar pastas que ficarem vazias após a organização">
      <input type="checkbox" id="chkDeleteEmptyFolders" checked>
      <span class="toggle-slider"></span>
      <span class="toggle-label">Delete Empty folders.</span>
    </label>
  </div>

  <div id="statusMsg"></div>

  <script src="CSInterface.js"></script>
  <script src="PresetManager.js"></script>
  <script src="main.js"></script>
</body>

</html>
