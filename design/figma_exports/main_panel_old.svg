<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620">
  <defs>
    <style>
      .bg-panel { fill: #1e1e1e; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #8a8a8a; letter-spacing: 0.6px; text-transform: uppercase; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9a9a9a; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d4d4d4; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Janela Painel Principal TidyFlow -->
  <rect width="360" height="620" rx="4" class="bg-panel" stroke="#333333" stroke-width="1"/>

  <!-- AE Tab Header -->
  <g id="tab-header">
    <rect width="360" height="32" fill="#252525"/>
    <line x1="0" y1="32" x2="360" y2="32" stroke="#181818" stroke-width="1"/>
    <!-- Aba Ativa TidyFlow -->
    <rect width="110" height="32" fill="#1e1e1e"/>
    <line x1="0" y1="32" x2="110" y2="32" stroke="#1473e6" stroke-width="2"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff">TidyFlow</text>
    <g transform="translate(76, 13)" stroke="#888888" stroke-width="1.5">
      <line x1="0" y1="0" x2="10" y2="0"/>
      <line x1="0" y1="4" x2="10" y2="4"/>
      <line x1="0" y1="8" x2="10" y2="8"/>
    </g>
  </g>

  <!-- Conteúdo Principal -->
  <g transform="translate(14, 46)">
    <!-- Título da Seção TIDYFLOW -->
    <text x="0" y="10" class="text-title">TIDYFLOW</text>

    <!-- Barra de Preset -->
    <g id="preset-bar" transform="translate(0, 24)">
      <rect width="332" height="38" rx="3" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
      <text x="10" y="23" class="text-title" fill="#8a8a8a">PRESET</text>
      
      <!-- Select Preset: Default Clean (Default) -->
      <g id="preset-select" transform="translate(68, 6)">
        <rect width="186" height="26" rx="3" fill="#262626" stroke="#3c3c3c" stroke-width="1"/>
        <text x="8" y="17" class="text-label" font-weight="500">Default Clean (Default)</text>
        <path d="M 166,11 L 171,16 L 176,11" fill="none" stroke="#d4d4d4" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Botão ⚙ Editar -->
      <g id="btn-edit-preset" transform="translate(260, 6)">
        <rect width="64" height="26" rx="3" fill="#2e2e2e" stroke="#3e3e3e" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="none" stroke="#d4d4d4" stroke-width="1.2"/>
        <path d="M 12,8 L 12,9.5 M 12,16.5 L 12,18 M 7,13 L 8.5,13 M 15.5,13 L 17,13" stroke="#d4d4d4" stroke-width="1.2" stroke-linecap="round"/>
        <text x="26" y="17" class="text-label">Editar</text>
      </g>
    </g>

    <!-- Texto Informativo -->
    <text x="0" y="86" class="text-sub">Selecione as composições no painel Project antes de organizar.</text>

    <!-- Grade dos 4 Botões Principais -->
    <g id="action-tiles-grid" transform="translate(0, 98)">
      <!-- 1. Organizar Projeto (Primário / Ativo) -->
      <g id="btn-organize">
        <rect width="79" height="54" rx="4" fill="#1473e6" stroke="#1473e6" stroke-width="1"/>
        <text x="39" y="24" class="text-btn" fill="#ffffff" font-weight="bold">Organizar</text>
        <text x="39" y="37" class="text-btn" fill="#ffffff" font-weight="bold">Projeto</text>
      </g>

      <!-- 2. Criar estrutura de pastas -->
      <g id="btn-create-structure" transform="translate(84, 0)">
        <rect width="79" height="54" rx="4" fill="#2e2e2e" stroke="#3e3e3e" stroke-width="1"/>
        <text x="39" y="24" class="text-btn" fill="#d4d4d4">Criar estrutura de</text>
        <text x="39" y="37" class="text-btn" fill="#d4d4d4">pastas</text>
      </g>

      <!-- 3. Apenas Midias -->
      <g id="btn-media-only" transform="translate(168, 0)">
        <rect width="79" height="54" rx="4" fill="#2e2e2e" stroke="#3e3e3e"/>
        <text x="39" y="31" class="text-btn" fill="#d4d4d4">Apenas Midias</text>
      </g>

      <!-- 4. Verificar composições -->
      <g id="btn-check-comps" transform="translate(252, 0)">
        <rect width="79" height="54" rx="4" fill="#2e2e2e" stroke="#3e3e3e"/>
        <text x="39" y="24" class="text-btn" fill="#d4d4d4">Verificar</text>
        <text x="39" y="37" class="text-btn" fill="#d4d4d4">composições</text>
      </g>
    </g>

    <!-- Divisória sutil -->
    <line x1="0" y1="168" x2="332" y2="168" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Grupo de Toggles / Switches (5 opções exatas) -->
    <g id="options-switches" transform="translate(0, 184)">
      <!-- 1. Numeração Sequencial (LIGADO) -->
      <g id="toggle-prefix-numbering" transform="translate(0, 0)">
        <rect width="26" height="14" rx="7" fill="#1473e6"/>
        <circle cx="19" cy="7" r="5" fill="#ffffff"/>
        <text x="36" y="11" class="text-label">Numeração Sequencial (01_, 02_)</text>
      </g>

      <!-- 2. Salvar projeto antes de organizar (DESLIGADO) -->
      <g id="toggle-save-project" transform="translate(0, 26)">
        <rect width="26" height="14" rx="7" fill="#383838"/>
        <circle cx="7" cy="7" r="5" fill="#9a9a9a"/>
        <text x="36" y="11" class="text-label" fill="#888888">Salvar projeto antes de organizar</text>
      </g>

      <!-- 3. Reduce Project (DESLIGADO) -->
      <g id="toggle-reduce-project" transform="translate(0, 52)">
        <rect width="26" height="14" rx="7" fill="#383838"/>
        <circle cx="7" cy="7" r="5" fill="#9a9a9a"/>
        <text x="36" y="11" class="text-label" fill="#888888">Reduce Project</text>
      </g>

      <!-- 4. Delete Empty folders. (LIGADO) -->
      <g id="toggle-delete-empty-folders" transform="translate(0, 78)">
        <rect width="26" height="14" rx="7" fill="#1473e6"/>
        <circle cx="19" cy="7" r="5" fill="#ffffff"/>
        <text x="36" y="11" class="text-label">Delete Empty folders.</text>
      </g>

      <!-- 5. Agrupar pela Pasta de Origem (LIGADO) -->
      <g id="toggle-group-by-source-folder" transform="translate(0, 104)">
        <rect width="26" height="14" rx="7" fill="#1473e6"/>
        <circle cx="19" cy="7" r="5" fill="#ffffff"/>
        <text x="36" y="11" class="text-label">Agrupar pela Pasta de Origem</text>
      </g>
    </g>
  </g>
</svg>
