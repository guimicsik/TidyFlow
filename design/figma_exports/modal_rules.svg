<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620">
  <defs>
    <style>
      .bg-modal { fill: #1e1e1e; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #8a8a8a; letter-spacing: 0.6px; text-transform: uppercase; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9a9a9a; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #d4d4d4; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <!-- Ícone de Info (i) circular -->
    <g id="info-icon">
      <circle cx="6" cy="6" r="6" fill="#1473e6"/>
      <text x="6" y="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">i</text>
    </g>
    <g id="info-icon-dark">
      <circle cx="6" cy="6" r="6" fill="#444444"/>
      <text x="6" y="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="bold" fill="#888888" text-anchor="middle">i</text>
    </g>
  </defs>

  <!-- Fundo da Janela Modal -->
  <rect width="680" height="620" rx="6" class="bg-modal" stroke="#383838" stroke-width="1"/>

  <!-- Header Modal: Checkbox + Título + Fechar (✕) -->
  <g id="modal-header" transform="translate(18, 18)">
    <rect width="14" height="14" rx="2" fill="#2b2b2b" stroke="#444444"/>
    <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0e0e0">Regras e Filtros — Pasta: Solids</text>
    <!-- Botão Fechar ✕ -->
    <g id="btn-modal-close" transform="translate(616, -2)">
      <rect width="26" height="24" rx="3" fill="#2a2a2a" stroke="#383838"/>
      <text x="13" y="16" class="text-btn" fill="#888888">✕</text>
    </g>
  </g>

  <!-- Linha divisória fina -->
  <line x1="18" y1="46" x2="662" y2="46" stroke="#2a2a2a" stroke-width="1"/>

  <!-- CONTAINER DE SEÇÕES EM GRID -->
  <g transform="translate(18, 56)">
    
    <!-- ========================================== -->
    <!-- 1. TIPOS PERMITIDOS (COLUNA ESQUERDA SUPERIOR) -->
    <!-- ========================================== -->
    <g id="sec-tipos-permitidos" transform="translate(0, 0)">
      <text x="0" y="12" class="text-title">1. TIPOS PERMITIDOS</text>
      <use href="#info-icon-dark" x="126" y="2"/>

      <g transform="translate(0, 22)">
        <!-- Linha 1: Comp Principal / Pre-Comps -->
        <g id="btn-type-main-comp" transform="translate(0, 0)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Composição Principal</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-type-pre-comps" transform="translate(154, 0)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Pré-Composições</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 2: Imagens / Vídeos -->
        <g id="btn-type-images" transform="translate(0, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Imagens Estáticas</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-type-footages" transform="translate(154, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Vídeos / Footages</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 3: Seq. Imagem / Áudios -->
        <g id="btn-type-seq-image" transform="translate(0, 96)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Sequências de Imagem</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-type-audios" transform="translate(154, 96)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Áudios</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 4: Sólidos (ATIVO/BRILHO) / Dados e 3D -->
        <g id="btn-type-solids" transform="translate(0, 144)">
          <rect width="148" height="42" rx="4" fill="#1473e6" stroke="#3894ff" stroke-width="1.5"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff" font-weight="bold">Sólidos</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-type-data" transform="translate(154, 144)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Dados e 3D</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 2. SUBPASTAS E COMPORTAMENTO (COLUNA DIREITA SUPERIOR) -->
    <!-- ========================================== -->
    <g id="sec-subpastas-comportamento" transform="translate(340, 0)">
      <text x="0" y="12" class="text-title">2. SUBPASTAS E COMPORTAMENTO</text>
      <use href="#info-icon-dark" x="200" y="2"/>

      <g transform="translate(0, 22)">
        <!-- Linha 1: Subpastas por Extensão / Pasta de Origem (ATIVO) -->
        <g id="btn-comp-subext" transform="translate(0, 0)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Subpastas por Extensão</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-comp-pasta-origem" transform="translate(154, 0)">
          <rect width="148" height="42" rx="4" fill="#1473e6" stroke="#3894ff" stroke-width="1.5"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff" font-weight="bold">Pasta de Origem</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 2: Agrupar por Comp Principal / Isolar PSD / AI -->
        <g id="btn-comp-group-main" transform="translate(0, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="18" class="text-btn" fill="#ffffff">Agrupar por Comp</text>
          <text x="74" y="32" class="text-btn" fill="#ffffff">Principal</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-comp-isolar-psd" transform="translate(154, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Isolar PSD / AI</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 3: Pasta OTHERS (Fallback) - Botão Largo -->
        <g id="btn-comp-fallback" transform="translate(0, 96)">
          <rect width="302" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="151" y="25" class="text-btn" fill="#ffffff">Pasta OTHERS (Fallback)</text>
          <use href="#info-icon" x="284" y="6"/>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. FILTRO DE EXTENSÕES (COLUNA ESQUERDA INFERIOR) -->
    <!-- ========================================== -->
    <g id="sec-filtro-extensoes" transform="translate(0, 230)">
      <text x="0" y="12" class="text-title">3. FILTRO DE EXTENSÕES</text>
      <use href="#info-icon-dark" x="146" y="2"/>

      <g transform="translate(0, 22)">
        <!-- Linha 1: Imagens / Vídeos -->
        <g id="btn-pack-images" transform="translate(0, 0)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Imagens</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-pack-videos" transform="translate(154, 0)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Vídeos</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 2: Seq. Imagem / Áudios -->
        <g id="btn-pack-seq" transform="translate(0, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Seq. Imagem</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="btn-pack-audios" transform="translate(154, 48)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Áudios</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>

        <!-- Linha 3: Dados / 3D + Input Avulsa -->
        <g id="btn-pack-data" transform="translate(0, 96)">
          <rect width="148" height="42" rx="4" fill="#0d5cb6" stroke="#1473e6"/>
          <text x="74" y="25" class="text-btn" fill="#ffffff">Dados / 3D</text>
          <use href="#info-icon" x="130" y="6"/>
        </g>
        <g id="input-ext-avulsa" transform="translate(154, 96)">
          <rect width="186" height="42" rx="4" fill="#141414" stroke="#2d2d2d"/>
          <text x="12" y="25" class="text-sub" fill="#666666">Avulsa: exr, webp...</text>
          <!-- Botão [+] Azul anexado -->
          <g transform="translate(192, 0)">
            <rect width="42" height="42" rx="4" fill="#1473e6"/>
            <text x="21" y="25" class="text-btn" fill="#ffffff" font-weight="bold">[+]</text>
          </g>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 4. FILTRO POR NOMENCLATURA (COLUNA DIREITA INFERIOR) -->
    <!-- ========================================== -->
    <g id="sec-filtro-nomenclatura" transform="translate(340, 206)">
      <text x="0" y="12" class="text-title">4. FILTRO POR NOMENCLATURA</text>
      <use href="#info-icon-dark" x="176" y="2"/>

      <g transform="translate(0, 22)">
        <!-- Input Digite uma palavra + Botão [+] Adicionar -->
        <g id="input-word-add">
          <rect width="250" height="34" rx="4" fill="#141414" stroke="#2d2d2d"/>
          <text x="10" y="21" class="text-sub" fill="#888888">Digite uma palavra do nome e aper</text>
          <g transform="translate(258, 0)">
            <rect width="114" height="34" rx="4" fill="#1473e6"/>
            <text x="57" y="21" class="text-btn" fill="#ffffff" font-weight="bold">[+] Adicionar</text>
          </g>
        </g>

        <!-- Caixa de tags / Lista vazia -->
        <g id="word-tags-box" transform="translate(0, 42)">
          <rect width="372" height="54" rx="4" fill="#141414" stroke="#222222"/>
          <text x="12" y="24" class="text-sub" font-style="italic" fill="#555555">Nenhuma palavra filtrada.</text>
        </g>
      </g>
    </g>

  </g>

  <!-- RODAPÉ MODAL: CANCELAR E APLICAR REGRAS NA PASTA -->
  <g id="modal-footer" transform="translate(18, 560)">
    <line x1="0" y1="0" x2="644" y2="0" stroke="#282828" stroke-width="1"/>
    
    <!-- Botão Cancelar -->
    <g id="btn-cancel" transform="translate(390, 10)">
      <rect width="84" height="32" rx="4" fill="#252525" stroke="#383838"/>
      <text x="42" y="20" class="text-btn" fill="#d4d4d4">Cancelar</text>
    </g>

    <!-- Botão Azul: Aplicar Regras na Pasta -->
    <g id="btn-apply-rules" transform="translate(482, 10)">
      <rect width="162" height="32" rx="4" fill="#1473e6"/>
      <text x="81" y="20" class="text-btn" fill="#ffffff" font-weight="bold">Aplicar Regras na Pasta</text>
    </g>
  </g>
</svg>
