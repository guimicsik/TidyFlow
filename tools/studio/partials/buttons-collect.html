<!-- Cores: Collect Files -->
<div class="st-card" data-panel-card="collect">
  <h3 class="st-card-title">Botões do Rodapé (OK / Cancelar / Comentários)</h3>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo Botão OK</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-btn-ok-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-btn-ok-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Hover Botão OK</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-btn-ok-hover">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-btn-ok-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Texto Botão OK</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-btn-ok-text">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-btn-ok-text">
      </div>
    </div>
    <div class="st-color-item">
      <label>Borda Cancelar</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-btn-cancel-border">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-btn-cancel-border">
      </div>
    </div>
  </div>
</div>

<div class="st-card" data-panel-card="collect">
  <h3 class="st-card-title">Caixas &amp; Fundo do Collect Files</h3>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo da Janela</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo das Caixas</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-box-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-box-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Borda das Caixas</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-collect-box-border">
        <input type="text" class="st-hex" data-hex-for="--tf-collect-box-border">
      </div>
    </div>
  </div>
</div>
