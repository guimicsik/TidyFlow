<!-- Cores: Painel Principal -->
<div class="st-card" data-panel-card="main">
  <h3 class="st-card-title">Botão Hero (Organizar Projeto)</h3>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo (Rest)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-hero-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-hero-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Hover)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-hero-hover">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-hero-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Click)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-hero-active">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-hero-active">
      </div>
    </div>
    <div class="st-color-item">
      <label>Cor do Texto</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-hero-text">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-hero-text">
      </div>
    </div>
  </div>
</div>
