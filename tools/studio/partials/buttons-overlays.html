<!-- Cores: Overlays & Modais -->
<div class="st-card" data-panel-card="overlays">
  <h3 class="st-card-title">Botões de Ação dos Modais</h3>
  <p class="st-help">Cores dos botões primários, de confirmação, avisos e cancelamentos de alertas.</p>

  <div style="font-size: 11px; font-weight: 800; color: #60a5fa; margin: 10px 0 4px; text-transform: uppercase;">1. Botão Primário (Salvar / Aplicar Regras)</div>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo (Rest)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-primary-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-primary-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Hover)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-primary-hover">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-primary-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Texto</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-primary-text">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-primary-text">
      </div>
    </div>
  </div>

  <div style="font-size: 11px; font-weight: 800; color: #f59e0b; margin: 14px 0 4px; text-transform: uppercase;">2. Botão Atenção / Warning (Continuar sem Salvar)</div>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo (Rest)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-warning-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-warning-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Hover)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-warning-hover">
        <input type="text" data-token-hex="--tf-neo-warning-hover" data-hex-for="--tf-neo-warning-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Texto</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-warning-text">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-warning-text">
      </div>
    </div>
  </div>

  <div style="font-size: 11px; font-weight: 800; color: #ef4444; margin: 14px 0 4px; text-transform: uppercase;">3. Botão Destrutivo / Confirmar Exclusão</div>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo (Rest)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-danger-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-danger-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Hover)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-danger-hover">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-danger-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Texto</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-danger-text">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-danger-text">
      </div>
    </div>
  </div>

  <div style="font-size: 11px; font-weight: 800; color: #a1a1aa; margin: 14px 0 4px; text-transform: uppercase;">4. Botão Secundário / Cancelar</div>
  <div class="st-color-grid">
    <div class="st-color-item">
      <label>Fundo (Rest)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-ghost-bg">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-ghost-bg">
      </div>
    </div>
    <div class="st-color-item">
      <label>Fundo (Hover)</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-ghost-hover">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-ghost-hover">
      </div>
    </div>
    <div class="st-color-item">
      <label>Texto</label>
      <div class="st-color-picker-wrap">
        <input type="color" data-token="--tf-neo-ghost-text">
        <input type="text" class="st-hex" data-hex-for="--tf-neo-ghost-text">
      </div>
    </div>
  </div>
</div>
